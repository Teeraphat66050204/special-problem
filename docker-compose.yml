services:
  # PostgreSQL พร้อมส่วนขยาย pgvector สำหรับ Semantic Search
  postgres:
    image: pgvector/pgvector:pg16
    container_name: app_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: special_problem_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # MinIO สำหรับเก็บไฟล์ PDF และ Thumbnail
  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: app_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"   # API Port
      - "9001:9001"   # Console Dashboard Port
    volumes:
      - minio_data:/data

  # Redis สำหรับทำ Job Queue (BullMQ)
  redis:
    image: redis:7-alpine
    container_name: app_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  minio_data:
  redis_data: